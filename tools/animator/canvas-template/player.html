      html,
      body {
        margin: 0;
        background: #090b2c;
        color: white;
        font:
          16px Nunito,
          sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      canvas {
        width: min(100vw, calc((100vh - 64px) * 16 / 9));
        aspect-ratio: 16/9;
      }
      nav {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 12px;
      }
      button {
        padding: 8px 16px;
        border: 0;
        border-radius: 20px;
        background: #ffd23f;
      }
      input[type="range"] {
        width: 35vw;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas width="1280" height="720"></canvas>
      <nav>
        <button id="play">Play</button
        ><input
          id="scrub"
          aria-label="Seek"
          type="range"
          min="0"
          step="0.033333"
        /><span id="clock"></span> <button id="sound">Sound on</button
        ><label><input id="loop" type="checkbox" checked />Loop</label>
      </nav>
    </main>
    <script src="style/harness.js"></script>
    <script src="style/sound.js"></script>
    <script src="style/drawing.js"></script>
    <script src="animation.js"></script>
    <script src="player.js"></script>
  </body>
