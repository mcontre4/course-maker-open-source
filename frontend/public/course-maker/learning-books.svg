    <path d="M84 151C141 142 191 160 240 186C291 151 350 135 405 147L412 185C351 178 292 200 241 224C188 200 135 184 83 191L84 151Z" fill="#F4ECC9"/>
    <path d="M92 145C144 136 193 155 240 181C290 148 346 129 400 141L405 177C350 172 291 192 241 217C192 192 141 175 91 183L92 145Z" fill="#FFFBEF"/>
    <path d="M99 132C150 127 199 150 240 178C287 143 342 122 393 131L400 166C348 163 291 184 241 210C196 182 146 165 96 171L99 132Z" fill="#FFFCF3"/>

