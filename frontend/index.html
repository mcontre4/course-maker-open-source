<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <title>Course Maker — Your learning space</title>
    <meta
      name="description"
      content="Turn your curiosity into a course. Shape your syllabus, learn at your own pace, and see your progress."
    />
    <meta name="theme-color" content="#faf8f3" />
    <link rel="icon" type="image/svg+xml" href="/course-maker/brand-mark.svg" />


    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Course Maker" />
    <meta
      property="og:title"
      content="Course Maker — Your learning space"
    />
    <meta
      property="og:description"
      content="A course shaped around your curiosity."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Course Maker — Your learning space"
    />
    <meta
      name="twitter:description"
      content="A course shaped around your curiosity."
    />

    <!-- Linked rather than @imported: a CSS @import serialises the font request
         behind the stylesheet request and blocks render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
